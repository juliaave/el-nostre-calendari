    // Temps total del recorregut
    const duracioTotal = 3500;

    // Temps entre cada casella
    const tempsPerDia = duracioTotal / (diaActual - 1);

    const interval = setInterval(function() {

        dia++;

        if (dia > diaActual) {

            clearInterval(interval);
            return;
        }

        mourePersonatge(dia);

        // Seguim el personatge
        enfocarPersonatge();

    }, tempsPerDia);
}

// =========================
// CÀMERA / SCROLL
// =========================

function enfocarPersonatge() {

    const rect = personatge.getBoundingClientRect();

    const centrePantalla = window.innerHeight / 2;

    const diferencia =
        rect.top - centrePantalla;

    window.scrollBy({
        top: diferencia,
        behavior: "smooth"
    });
}

// ===============================
// CALENDARI AUTOMÀTIC
// ===============================

function obtenirDiaActual() {

    // Data d'inici del calendari
    const inici = new Date(2026, 11, 22, 0, 0, 0);

    // Data i hora actual
    const ara = new Date();

    // Diferència en mil·lisegons
    const diferencia = ara - inici;

    // Cada dia = 24 hores
    const diaEnMilisegons = 24 * 60 * 60 * 1000;

    // Si encara no ha començat
    if (diferencia < 0) {
        return 0;
    }

    // Calculem quin dia toca
    const dia = Math.floor(diferencia / diaEnMilisegons) + 1;

    // Com a màxim, dia 30
    return Math.min(dia, 30);
}

// 🧪 MODE PROVES
// Posa false quan vulguis activar el calendari real
const modeProves = true;

const diaProva = 10;

const diaActual = modeProves
    ? diaProva
    : obtenirDiaActual();
// ===============================
// COMPTE ENRERE DEL SEGÜENT COFRE
// ===============================

function actualitzarCompteEnrere() {

    const ara = new Date();

    // Si ja hem arribat al dia 30
    if (diaActual >= 30) {

        document.getElementById("tempsRestant").textContent =
            "🎉 AVENTURA COMPLETADA!";

        return;
    }

    // Data d'inici del calendari
    const iniciCalendari =
        new Date(2026, 11, 22, 0, 0, 0);

    // Quin dia serà el següent
    const seguentDia = diaActual + 1;

    // Moment exacte en què es desbloqueja
    const properCofre = new Date(
        iniciCalendari.getTime() +
        (seguentDia - 1) * 24 * 60 * 60 * 1000
    );

    // Temps que falta
    let diferencia = properCofre - ara;

    // Evitem números negatius
    if (diferencia < 0) {
        diferencia = 0;
    }

    // Convertim el temps
    const dies = Math.floor(
        diferencia / (1000 * 60 * 60 * 24)
    );

    const hores = Math.floor(
        (diferencia % (1000 * 60 * 60 * 24)) /
        (1000 * 60 * 60)
    );

    const minuts = Math.floor(
        (diferencia % (1000 * 60 * 60)) /
        (1000 * 60)
    );

    const segons = Math.floor(
        (diferencia % (1000 * 60)) /
        1000
    );

    // Mostrem el compte enrere
    document.getElementById("tempsRestant").textContent =
    "DIA " + seguentDia + " · " +
    String(hores).padStart(2, "0") + ":" +
    String(minuts).padStart(2, "0") + ":" +
    String(segons).padStart(2, "0")
}


// Actualitzem cada segon
actualitzarCompteEnrere();

setInterval(function() {

    actualitzarCompteEnrere();

}, 1000);

// ===============================
// CREEM ELS 30 DIES
// ===============================

for (let dia = 1; dia <= 30; dia++) {

    const boto = document.createElement("button");

    boto.classList.add("dia");

    // Posició del dia
    const posicio = posicionsDies[dia];

    boto.style.left = posicio.x + "%";
    boto.style.top = posicio.y + "px";

    boto.style.transform = "translateX(-50%)";


    // Dies desbloquejats
    if (dia <= diaActual) {

        boto.textContent = dia;

        boto.addEventListener("click", function() {

            obrirCofre(dia);

        });

   } else {

    boto.textContent = "🔒";

    boto.classList.add("bloquejat");

    boto.disabled = true;

    boto.addEventListener("mouseenter", function() {

        mostrarMissatgeBloquejat(dia, boto);

    });

    boto.addEventListener("mouseleave", function() {

        ocultarMissatgeBloquejat();

    });
}

    calendari.appendChild(boto);
}

// ===============================
// MISSATGE DELS DIES BLOQUEJATS
// ===============================

function mostrarMissatgeBloquejat(dia, boto) {

    const missatge =
        document.getElementById("missatgeBloquejat");

    const diesRestants = dia - diaActual;

    if (diesRestants === 1) {

        missatge.textContent =
            "🔒 Et falta 1 dia per poder obrir aquest cofre";

    } else {

        missatge.textContent =
            "🔒 Et falten " +
            diesRestants +
            " dies per poder obrir aquest cofre";
    }

    const rect = boto.getBoundingClientRect();

    missatge.style.left =
        (rect.left + rect.width / 2) + "px";

    missatge.style.top =
        (rect.top - 55) + "px";

    missatge.style.transform =
        "translateX(-50%)";

    missatge.style.display = "block";
}


function ocultarMissatgeBloquejat() {

    document.getElementById(
        "missatgeBloquejat"
    ).style.display = "none";
}
</script>
